# fork: upstream has no CI. This exists to catch the one failure that arrives
# silently - a tree that no longer compiles against the pinned Hyprland, whether
# from a change here or from a commit cherry-picked off upstream - without
# needing a live session to find out.
#
# It deliberately does NOT gate formatting. The tree does not match its own
# .clang-format, much of which is clang-format version skew rather than real
# drift, and reformatting a tree that still takes commits from upstream would
# conflict with every one of them. See the review notes before adding such a
# gate.
name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    name: nix build
    runs-on: ubuntu-latest
    # Generous: the timeout is what turns "the binary cache went away" into a
    # visible failure rather than a runner building Hyprland from source.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            # Hyprland is far too large to build on a runner, so pull it from
            # the project's own cache. A stale key does not break the build, it
            # falls back to building from source and hits the timeout above.
            extra-substituters = https://hyprland.cachix.org
            extra-trusted-public-keys = hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc=

      # flake.lock pins the Hyprland whose headers this is built against, which
      # is the whole point: src/main.cpp refuses to load on a hash mismatch, so
      # "it builds" only means anything against a pinned version.
      - run: nix build .#hy3 --print-build-logs

  scripts:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Warnings and errors. This said "errors only, tighten to warning once the
      # existing findings are cleared" - and by the time anyone checked there
      # were none left to clear, so the deferral had outlived its reason.
      #
      # It stops here rather than going further on purpose: the level below this
      # is `info`, where the three remaining findings live, and they are the kind
      # the harness is deliberately written against. A gate that cries wolf is a
      # gate that gets ignored.
      - run: shellcheck --severity=warning test/*.sh
      - run: bash -n test/*.sh
